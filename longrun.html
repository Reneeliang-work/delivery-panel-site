  if(!__DP_GC) return;
  try{
    var __dp_seg = location.pathname.split('/');
    var page = (__dp_seg.pop() || 'index.html').replace(/\.html$/, '') || 'index';
    // 环大陆单独入口（huandalu/ 子目录）：统计名加前缀，免得和大盘的 index 混在一起
    var __dp_dir = __dp_seg.pop();
    if (__dp_dir === 'huandalu') page = 'huandalu_' + page;
    else if (__dp_dir === 'huandalu-lifecycle') page = 'huandalu_lc_' + page;
    var q = 'p=' + encodeURIComponent(kind + '/' + page) + '&e=true'
          + '&t=' + encodeURIComponent(kind + ' · ' + page)
          + '&s=' + encodeURIComponent(screen.width + ',' + screen.height + ',' + (window.devicePixelRatio || 1))
          + '&rnd=' + Math.random().toString(36).slice(2);
    // keepalive：解锁后 document.open() 会替换整页，普通请求可能被取消
    fetch('https://' + __DP_GC + '.goatcounter.com/count?' + q, {mode:'no-cors', keepalive:true, credentials:'omit'});
  }catch(e){}
}

function __dp_b64(s){var r=atob(s),a=new Uint8Array(r.length);
  for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}

async function __dp_unlock(pw, quiet){
  var enc = new TextEncoder();
  var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  var bits = await crypto.subtle.deriveBits(
    {name:'PBKDF2', salt:__dp_b64(__DP_D.salt), iterations:__DP_D.iter, hash:'SHA-256'}, base, 512);
  var raw = new Uint8Array(bits);
  var encKey = raw.slice(0, 32), macKey = raw.slice(32, 64);

  var iv = __dp_b64(__DP_D.iv), ct = __dp_b64(__DP_D.ct);
  var signed = new Uint8Array(iv.length + ct.length);
  signed.set(iv, 0); signed.set(ct, iv.length);

  var hk = await crypto.subtle.importKey('raw', macKey,
    {name:'HMAC', hash:'SHA-256'}, false, ['verify']);
  var ok = await crypto.subtle.verify('HMAC', hk, __dp_b64(__DP_D.mac), signed);
  if(!ok) throw new Error('bad password');

  var ck = await crypto.subtle.importKey('raw', encKey, {name:'AES-CBC'}, false, ['decrypt']);
  var plain = await crypto.subtle.decrypt({name:'AES-CBC', iv:iv}, ck, ct);
  try{ sessionStorage.setItem(__DP_KEY, pw); }catch(e){}
  __dp_hit('view');
  var html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}

document.getElementById('f').addEventListener('submit', async function(ev){
  ev.preventDefault();
  var b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; e.textContent = '解密中…';
  try{ await __dp_unlock(document.getElementById('pw').value); }
  catch(err){ __dp_hit('badpw'); e.textContent = '密码不对'; b.disabled = false;
              document.getElementById('pw').select(); }
});

__dp_hit('open');

// 同一次浏览会话里，页面之间跳转不用重复输密码
(async function(){
  var saved = null;
  try{ saved = sessionStorage.getItem(__DP_KEY); }catch(e){}
  if(!saved) return;
  try{ await __dp_unlock(saved, true); }
  catch(err){ try{ sessionStorage.removeItem(__DP_KEY); }catch(e){} }
})();
