var KEY = 'dp_pw';

function b64(s){var r=atob(s),a=new Uint8Array(r.length);
  for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}

async function unlock(pw, quiet){
  var enc = new TextEncoder();
  var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  var bits = await crypto.subtle.deriveBits(
    {name:'PBKDF2', salt:b64(D.salt), iterations:D.iter, hash:'SHA-256'}, base, 512);
  var raw = new Uint8Array(bits);
  var encKey = raw.slice(0, 32), macKey = raw.slice(32, 64);

  var iv = b64(D.iv), ct = b64(D.ct);
  var signed = new Uint8Array(iv.length + ct.length);
  signed.set(iv, 0); signed.set(ct, iv.length);

  var hk = await crypto.subtle.importKey('raw', macKey,
    {name:'HMAC', hash:'SHA-256'}, false, ['verify']);
  var ok = await crypto.subtle.verify('HMAC', hk, b64(D.mac), signed);
  if(!ok) throw new Error('bad password');

  var ck = await crypto.subtle.importKey('raw', encKey, {name:'AES-CBC'}, false, ['decrypt']);
  var plain = await crypto.subtle.decrypt({name:'AES-CBC', iv:iv}, ck, ct);
  try{ sessionStorage.setItem(KEY, pw); }catch(e){}
  var html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}

document.getElementById('f').addEventListener('submit', async function(ev){
  ev.preventDefault();
  var b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; e.textContent = '解密中…';
  try{ await unlock(document.getElementById('pw').value); }
  catch(err){ e.textContent = '密码不对'; b.disabled = false;
              document.getElementById('pw').select(); }
});

// 同一次浏览会话里，页面之间跳转不用重复输密码
(async function(){
  var saved = null;
  try{ saved = sessionStorage.getItem(KEY); }catch(e){}
  if(!saved) return;
  try{ await unlock(saved, true); }
  catch(err){ try{ sessionStorage.removeItem(KEY); }catch(e){} }
})();
